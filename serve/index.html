<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NextBasket Studio</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js"></script>
<style>
:root {
  --bg: #f5f7fb; --card: #fff; --ink: #0f172a; --muted: #5b6b80; --line: #e2e8f0; --brand: #4f46e5; --brand2: #0891b2;
  --repeat: #047857; --co: #1d4ed8; --trend: #b45309; --due: #b91c1c; --radius: 14px;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
button, input, select { font: inherit; }
:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* header */
header { background: linear-gradient(120deg, #312e81, var(--brand) 45%, var(--brand2)); color: #fff; padding: 22px 0 64px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
.logo i { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-style: normal; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.16); padding: 6px 12px; border-radius: 999px; font-size: .85rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; animation: pulse 1.4s infinite; }
.dot.ok { background: #34d399; animation: none; }
@keyframes pulse { 50% { opacity: .35; } }
.lang { display: flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: none; color: #fff; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.lang button.on { background: #fff; color: var(--brand); font-weight: 600; }
h1 { font-size: 1.9rem; margin: 26px 0 6px; line-height: 1.2; }
.sub { opacity: .92; max-width: 780px; margin: 0; }

/* help tooltip */
.help { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #e0e7ff; color: var(--brand);
        font-size: .72rem; font-weight: 700; cursor: help; position: relative; vertical-align: middle; margin-left: 4px; flex: none; }
.help:hover::after, .help:focus::after { content: attr(data-tip); position: absolute; top: 130%; left: 50%; transform: translateX(-50%);
  width: 260px; background: var(--ink); color: #fff; font-weight: 400; font-size: .8rem; line-height: 1.45; padding: 8px 10px; border-radius: 10px;
  z-index: 20; text-align: left; white-space: normal; box-shadow: var(--shadow); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: -44px; }
.kpi { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; animation: up .5s both; }
.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi b { font-size: 1.75rem; color: var(--brand); line-height: 1.1; }
.kpi .lbl { display: block; color: var(--muted); font-size: .84rem; font-weight: 500; margin-top: 4px; }
.note { color: var(--muted); font-size: .8rem; margin: 8px 2px 0; }
details.subnote { margin: 8px 2px 0; font-size: .8rem; color: var(--muted); }
details.subnote summary { cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--muted); user-select: none; }
details.subnote summary:hover { color: var(--brand); }
details.subnote p { margin: 6px 0 0; padding: 8px 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; line-height: 1.5; max-width: 880px; }

/* data bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 18px 0; background: var(--card); border-radius: var(--radius);
       box-shadow: var(--shadow); padding: 12px 14px; }
.drop { flex: 1; min-width: 260px; border: 2px dashed var(--line); border-radius: 12px; padding: 10px 14px; color: var(--muted); cursor: pointer;
        transition: .2s; display: flex; align-items: center; gap: 10px; }
.drop:hover, .drop.over { border-color: var(--brand); background: #eef2ff; color: var(--brand); }
.btn { border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; background: var(--brand); color: #fff; font-weight: 600; transition: .15s; text-decoration: none; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,70,229,.3); }
.btn.ghost { background: #eef2ff; color: var(--brand); }
.btn:disabled { opacity: .5; cursor: wait; transform: none; box-shadow: none; }
.k { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }

/* tabs */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
.tab.on { color: var(--brand); border-color: var(--brand); }
.view { display: none; animation: fade .3s; } .view.on { display: block; }
@keyframes fade { from { opacity: 0; } } @keyframes up { from { opacity: 0; transform: translateY(10px); } }

/* members view */
.grid3 { display: grid; grid-template-columns: 290px 1fr 300px; gap: 16px; align-items: start; }
.panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
.search { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
.members { max-height: 680px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.mem { border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; cursor: pointer; transition: .15s; background: #fff; text-align: left; }
.mem:hover { border-color: #c7d2fe; transform: translateX(2px); }
.mem.on { border-color: var(--brand); background: #eef2ff; }
.mem .id { font-weight: 600; font-size: .9rem; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: .74rem; padding: 1px 8px; border-radius: 999px; background: #f1f5f9; color: #334155; white-space: nowrap; }
.tag.new { background: #e0f2fe; color: #075985; } .tag.mid { background: #fef3c7; color: #854d0e; } .tag.loyal { background: #ede9fe; color: #5b21b6; }
.tag.due { background: #fee2e2; color: var(--due); } .tag.x { background: #dbeafe; color: var(--co); } .tag.nd { background: #dcfce7; color: #166534; }
.profile { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.stat { background: #f8fafc; border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.25rem; } .stat span { color: var(--muted); font-size: .8rem; }
.depts { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
h3 { margin: 6px 0 10px; font-size: 1rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h3 small { color: var(--muted); font-weight: 400; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
.card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; transition: .2s; animation: up .4s both;
        animation-delay: calc(var(--i) * 45ms); display: flex; flex-direction: column; }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.thumb { min-height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 34px 10px 8px; color: #fff; position: relative; }
.thumb .rk { position: absolute; top: 8px; left: 10px; background: rgba(0,0,0,.28); padding: 0 8px; border-radius: 999px; font-size: .75rem; }
.thumb .dp { font-weight: 700; font-size: 1rem; line-height: 1.25; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.thumb .sub2 { font-size: .74rem; opacity: .92; margin-top: 2px; } .thumb .sub2 code { font-family: ui-monospace, monospace; }
.badge { position: absolute; top: 8px; right: 8px; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #fff; }
.badge.due { color: var(--due); } .badge.nd { color: #166534; }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.src { font-size: .78rem; font-weight: 700; } .src.repeat { color: var(--repeat); } .src.co_purchase { color: var(--co); } .src.trend { color: var(--trend); }
.why { font-size: .88rem; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: .8rem; color: var(--muted); margin-top: auto; }
.scale { display: flex; gap: 2px; } .scale i { width: 14px; height: 6px; border-radius: 2px; background: #e2e8f0; }
.scale i.f { background: #0f766e; }
.prio { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.prio .scale i.f { background: var(--brand); }
.code { font-family: ui-monospace, monospace; font-size: .78rem; color: var(--muted); }
.empty { color: var(--muted); padding: 30px; text-align: center; }

/* legend */
details.legend { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-bottom: 14px; font-size: .85rem; }
details.legend summary { cursor: pointer; font-weight: 600; color: var(--brand); }
.lg { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; margin-top: 10px; }
.lg div { display: flex; flex-direction: column; gap: 4px; } .lg b { font-size: .82rem; }
.lg .r { display: flex; align-items: center; gap: 8px; color: var(--muted); }

/* phone preview */
.phone { width: 270px; margin: 0 auto; border-radius: 36px; background: #0f172a; padding: 12px; box-shadow: 0 20px 40px rgba(15,23,42,.25); }
.screen { background: #fff; border-radius: 26px; overflow: hidden; height: 560px; display: flex; flex-direction: column; }
.notch { height: 22px; background: #0f172a; width: 120px; margin: 0 auto; border-radius: 0 0 14px 14px; }
.app { padding: 12px 14px; overflow: auto; flex: 1; }
.app .hi { font-weight: 700; font-size: 1.05rem; } .app .hs { color: var(--muted); font-size: .8rem; margin-bottom: 10px; }
.app .sec { font-weight: 700; font-size: .85rem; margin: 12px 0 6px; }
.row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.mini { min-width: 110px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; animation: up .4s both; animation-delay: calc(var(--i) * 60ms); }
.mini .t { height: 60px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .85rem; text-align: center; padding: 0 4px; }
.mini .c { padding: 6px 8px; font-size: .72rem; line-height: 1.35; color: var(--muted); }
.mini .cta { margin: 0 8px 8px; font-size: .72rem; background: var(--ink); color: #fff; border-radius: 8px; text-align: center; padding: 4px; }
.cap { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 10px; }

/* campaigns */
.ctypes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.ctype { border: 2px solid var(--line); border-radius: var(--radius); background: #fff; padding: 14px; cursor: pointer; text-align: left; transition: .2s; }
.ctype:hover { border-color: #c7d2fe; } .ctype.on { border-color: var(--brand); box-shadow: 0 8px 20px rgba(79,70,229,.15); }
.ctype .ic { font-size: 1.4rem; } .ctype b { display: block; margin: 4px 0 2px; } .ctype span { color: var(--muted); font-size: .84rem; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .85rem; transition: .15s; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.sum { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 12px; }
.sum .stat b { font-size: 1.5rem; color: var(--brand); }
.msg-bar { display: flex; align-items: center; gap: 10px; background: #eef2ff; border: 1px solid #c7d2fe; color: #1e1b4b; padding: 9px 14px; border-radius: 12px; margin-bottom: 14px; font-size: .86rem; }
.msg-bar b { color: var(--brand); white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: .8rem; padding: 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
tr.in { animation: up .35s both; animation-delay: calc(var(--i) * 30ms); }
.msg { color: #334155; }
.toast { position: fixed; bottom: 22px; right: 22px; transform: translateY(90px); max-width: 360px; font-size: .88rem; background: var(--ink); color: #fff; padding: 10px 18px;
         border-radius: 12px; transition: .3s; z-index: 30; } .toast.on { transform: translateY(0); }
.skel { background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 12px; height: 150px; }
@keyframes sh { to { background-position: -200% 0; } }
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.guide h4 { margin: 0 0 6px; } .guide ol, .guide ul { margin: 0; padding-left: 18px; } .guide li { margin: 4px 0; }
.about { white-space: pre-wrap; font: .9rem/1.6 system-ui, sans-serif; }
/* best model (back-test) */
.bt-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.bt-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; }
.mcard { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; }
.mcard-hd { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--ink); }
.lift { background: #dcfce7; color: #166534; font-weight: 700; font-size: .72rem; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.mbar { display: grid; grid-template-columns: 32px 1fr 48px; align-items: center; gap: 7px; font-size: .78rem; }
.mbar .lbl { font-weight: 700; color: var(--muted); } .mbar.best .lbl { color: var(--brand); }
.mbar .track { height: 9px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
.mbar .fill { height: 100%; border-radius: 999px; background: #94a3b8; transition: width .5s ease; }
.mbar.best .fill { background: linear-gradient(90deg, var(--brand), var(--brand2)); }
.mbar .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.mbar.best .val { color: var(--brand); }
.sbar { height: 12px; border-radius: 999px; overflow: hidden; display: flex; background: #e2e8f0; margin: 2px 0; }
.sbar i { height: 100%; transition: width .4s ease; }
.sleg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; font-size: .73rem; color: var(--muted); }
.sleg span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sleg b { color: var(--ink); }
.sw-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.bt-grid { display: grid; grid-template-columns: 290px 1fr; gap: 16px; align-items: start; }
.bt-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.bt-controls select { min-width: 0; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); font-size: .84rem; }
.bt-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lst { display: flex; flex-direction: column; gap: 6px; }
.li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: .84rem; animation: up .35s both; animation-delay: calc(var(--i) * 30ms); }
.li.hit { border-color: #34d399; background: #ecfdf5; }
.li .sw { width: 34px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: .72rem; font-weight: 700; }
.li .nm { line-height: 1.25; min-width: 0; } .li .nm small { display: block; color: var(--muted); font-size: .74rem; }
.ok { color: #047857; font-weight: 700; font-size: .76rem; white-space: nowrap; background: #d1fae5; padding: 1px 7px; border-radius: 999px; }
.bt-badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 999px; font-size: .71rem; font-weight: 700; background: #f1f5f9; color: #334155; white-space: nowrap; }
.bt-badge.hit { background: #dcfce7; color: #166534; } .bt-badge.miss { background: #f1f5f9; color: #64748b; font-weight: 500; }
.bt-chip { background: #e2e8f0; color: #0f172a !important; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; max-height: 150px; overflow: auto; }
.history-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; margin-bottom: 12px; }
.history-group { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: #f8fafc; }
.history-group[open] { grid-column: 1 / -1; background: #fff; }
.history-group summary { cursor: pointer; font-size: .82rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.history-group summary span { color: var(--muted); font-weight: 400; font-size: .76rem; }
.history-group .chips { max-height: 120px; margin: 8px 0 0; }
.bt-bought { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.bt-purchase { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; border: 1px solid var(--line); background: #f8fafc; border-radius: 10px; padding: 5px 8px; }
.colh { font-weight: 700; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
.colh.best-col { border-color: var(--brand); }
.colh .n { font-size: .78rem; color: var(--muted); font-weight: 700; background: #f1f5f9; padding: 2px 9px; border-radius: 999px; }
.colh.best-col .n { background: #eef2ff; color: var(--brand); }
.hit-bar { display: inline-flex; gap: 2px; vertical-align: middle; margin-right: 4px; }
.hit-bar i { width: 5px; height: 10px; border-radius: 2px; background: #cbd5e1; display: inline-block; }
.hit-bar i.on { background: #10b981; }
footer { color: var(--muted); font-size: .8rem; padding: 26px 0 40px; }
@media (max-width: 1100px) { .grid3, .bt-grid, .cmp { grid-template-columns: 1fr; } .bt-kpis, .kpis { grid-template-columns: repeat(2, 1fr); } .ctypes { grid-template-columns: 1fr; }
  .profile { grid-template-columns: repeat(2, 1fr); } .sum { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .bt-kpis, .kpis { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .wrap { padding: 0 12px; } .top { flex-wrap: wrap; } .top > div:last-child { max-width: 100%; }
  .bt-controls { grid-template-columns: 1fr; } .bt-kpis .stat { min-width: 0; } .bt-kpis .stat > div { flex-wrap: wrap; gap: 4px 8px !important; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><i aria-hidden="true">◆</i> NextBasket Studio</div>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="pill" role="status"><span class="dot" id="dot"></span><span id="engine"></span></span>
        <div class="lang" role="group" aria-label="Language"><button data-l="vi" class="on">Tiếng Việt</button><button data-l="en">English</button></div>
      </div>
    </div>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="subtitle"></p>
  </div>
</header>

<main class="wrap">
  <section class="kpis" id="kpis"></section>
  <details class="subnote"><summary>ⓘ <span data-i="kpiMethod"></span></summary><p data-i="kpinote"></p></details>

  <section class="bar">
    <label class="drop" id="drop"><input type="file" id="file" accept=".csv" hidden /><span aria-hidden="true">⬆</span><span id="dropText"></span></label>
    <button class="btn ghost" id="sample" disabled data-i="sample"></button>
    <a class="btn ghost" href="reference/sample_purchases.csv" download data-i="template"></a>
    <label class="btn ghost" id="namesBtn"><input type="file" id="names" accept=".csv" hidden /><span data-i="names"></span></label>
    <span class="help" tabindex="0" data-ti="namesHelp">?</span>
    <label class="k"><span data-i="topk"></span> <input type="range" id="k" min="5" max="20" value="10" /> <b id="kv">10</b>
      <span class="help" tabindex="0" data-ti="topkHelp">?</span></label>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab on" id="tab-customers" role="tab" aria-selected="true" aria-controls="customers" tabindex="0" data-v="customers" data-i="tab1"></button>

    ? `${esc(department)}${!outRef || hasPrice ? " · " + esc(priceText) : ""} · <code>${esc(x.model_id)}</code>`
    : `<code>${esc(x.model_id)}</code>${!outRef || hasPrice ? " · " + esc(priceText) : ""}`;
  const nm = `${esc(NAMES[x.model_id] ?? department)}<small>${meta}</small>`;
  return `<div class="li ${x.bought ? "hit" : ""}" style="--i:${i}"><span class="sw" style="${btTile(x.department)}">#${i + 1}</span><span class="nm">${nm}</span>
    <span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end">${inBoth ? `<span class="bt-badge">${t("btBothLists")}</span>` : ""}${x.bought ? `<span class="ok">${t("btOk")}</span>` : ""}<span class="tag ${x.repeat ? "" : "x"}">${x.repeat ? t("btRepeat") : t("btNew")}</span></span></div>`;
}
function renderBest() {
  if (!BT) return;
  const pct = (v) => `${num(100 * v, 1)}%`, n = BT.members.length || 1;
  const lift = (b, q) => `+${Math.round(((b - q) / q) * 100)}%`;
  const mcard = (lbl, b, q, fb, fq, max) => `<div class="mcard"><div class="mcard-hd"><span>${lbl}</span><span class="lift">${lift(b, q)}</span></div>
    <div class="mbar best"><span class="lbl">P3</span><div class="track"><div class="fill" style="width:${Math.min(100, (b / max) * 100)}%"></div></div><span class="val">${fb}</span></div>
    <div class="mbar"><span class="lbl">GP</span><div class="track"><div class="fill" style="width:${Math.min(100, (q / max) * 100)}%"></div></div><span class="val">${fq}</span></div></div>`;
  let cBoth = 0, cP3 = 0, cGp = 0, cNone = 0;
  BT.members.forEach((m) => { const p = hits(m, "best") > 0, g = hits(m, "status_quo") > 0; if (p && g) cBoth++; else if (p) cP3++; else if (g) cGp++; else cNone++; });
  const distCard = `<div class="mcard"><div class="mcard-hd"><span>${t("btDist")(BT.members.length)}</span></div>
    <div class="sbar"><i style="width:${(100 * cP3) / n}%;background:var(--brand)"></i><i style="width:${(100 * cBoth) / n}%;background:var(--brand2)"></i><i style="width:${(100 * cGp) / n}%;background:#f59e0b"></i><i style="width:${(100 * cNone) / n}%;background:#cbd5e1"></i></div>
    <div class="sleg">
      <span><i class="sw-dot" style="background:var(--brand)"></i>${t("btP3Only")}: <b>${cP3}</b></span>
      <span><i class="sw-dot" style="background:var(--brand2)"></i>${t("btBothHit")}: <b>${cBoth}</b></span>
      <span><i class="sw-dot" style="background:#f59e0b"></i>${t("btGpOnly")}: <b>${cGp}</b></span>
      <span><i class="sw-dot" style="background:#cbd5e1"></i>${t("btNeitherHit")}: <b>${cNone}</b></span>
    </div></div>`;
  $("#btKpis").innerHTML = [
    mcard(t("btAll"), TEST.hr10.best, TEST.hr10.status_quo, pct(TEST.hr10.best), pct(TEST.hr10.status_quo), 0.3),
    mcard(t("btNdcg"), TEST.ndcg.best, TEST.ndcg.status_quo, num(TEST.ndcg.best, 3), num(TEST.ndcg.status_quo, 3), 0.13),
    mcard(t("btSample")(BT.members.length), BT.sample_hr10.best, BT.sample_hr10.status_quo, pct(BT.sample_hr10.best), pct(BT.sample_hr10.status_quo), Math.max(0.3, BT.sample_hr10.best * 1.15)),
    distCard,
  ].join("");
  const q = $("#bq").value.trim().toLowerCase();
  const country = $("#btCountry").value, segment = $("#btSegment").value, outcome = $("#btOutcome").value, sort = $("#btSort").value;
  const members = BT.members.filter((m) => {
    const p3 = hits(m, "best") > 0, gp = hits(m, "status_quo") > 0;
    return m.member_id.toLowerCase().includes(q) && (country === "all" || m.country_code === country) &&
      (segment === "all" || m.segment === segment) &&
      (outcome === "all" || (outcome === "p3" && p3) || (outcome === "gp" && gp) ||
       (outcome === "both" && p3 && gp) || (outcome === "neither" && !p3 && !gp));
  });
  members.sort((a, b) => sort === "best" ? hits(b, "best") - hits(a, "best") || a.member_id.localeCompare(b.member_id)
    : sort === "diff" ? (hits(b, "best") - hits(b, "status_quo")) - (hits(a, "best") - hits(a, "status_quo")) || a.member_id.localeCompare(b.member_id)
      : a.member_id.localeCompare(b.member_id));
  if (!members.some((member) => member.member_id === BSEL)) BSEL = members[0]?.member_id ?? null;
  const memberList = $("#btMembers");
  memberList.innerHTML = members.length ? members.map((m) =>
    `<button class="mem ${m.member_id === BSEL ? "on" : ""}" aria-pressed="${m.member_id === BSEL}" data-m="${esc(m.member_id)}"><div class="id">${esc(m.member_id)}</div>
      <div class="tags"><span class="tag ${m.segment}">${t("seg_" + m.segment)}</span><span class="tag">${t("cty")[m.country_code] ?? m.country_code}</span>
      <span class="tag x">P3 ${hits(m, "best")}</span><span class="tag">GP ${hits(m, "status_quo")}</span></div></button>`).join("")
    : `<div class="empty">${t("btNoMatches")}</div>`;
  bindMemberNavigation(memberList, (id) => { BSEL = id; renderBest(); });
  memberList.querySelectorAll(".mem").forEach((b) => b.addEventListener("click", () => { BSEL = b.dataset.m; renderBest(); }));
  const m = BT.members.find((x) => x.member_id === BSEL);
  if (!m) { $("#btDetail").innerHTML = `<div class="empty">${t("btNoMatches")}</div>`; return; }
  const chip = (x, sub) => `<span class="tag bt-chip" title="${esc(x.model_id)}">${esc(NAMES[x.model_id] ?? btDepartment(x.department))} · ${sub}</span>`;
  const historyByDepartment = new Map();
  m.history.forEach((item) => {
    const department = btDepartment(item.department);
    if (!historyByDepartment.has(department)) historyByDepartment.set(department, []);
    historyByDepartment.get(department).push(item);
  });
  const history = [...historyByDepartment].sort((a, b) =>
    Math.min(...a[1].map((item) => item.days_before)) - Math.min(...b[1].map((item) => item.days_before)) || a[0].localeCompare(b[0]));
  const bestIds = new Set(m.best.map((item) => item.model_id)), gpIds = new Set(m.status_quo.map((item) => item.model_id));
  const boughtItem = (item) => {
    const inBest = bestIds.has(item.model_id), inGp = gpIds.has(item.model_id);
    return `<div class="bt-purchase">${chip(item, `${item.repeat ? t("btRepeat") : t("btNew")}, ${t("btDaysAfter")(item.days_after)}`)}
      <span class="bt-badge ${inBest ? "hit" : "miss"}">${inBest ? t("btP3Top") : t("btP3Miss")}</span>
      <span class="bt-badge ${inGp ? "hit" : "miss"}">${inGp ? t("btGpTop") : t("btGpMiss")}</span></div>`;
  };
  const hitDots = (arr) => `<span class="hit-bar" aria-hidden="true">${arr.map((x) => `<i class="${x.bought ? "on" : ""}"></i>`).join("")}</span>`;
  const col = (k, title) => `<div><div class="colh ${k === "best" ? "best-col" : ""}"><span>${title}</span><span class="n">${hitDots(m[k])}${t("btHits")(hits(m, k))}</span></div>
    <div class="lst">${m[k].map((item, i) => btItem(item, i, (k === "best" ? gpIds : bestIds).has(item.model_id))).join("")}</div>${hits(m, k) ? "" : `<p class="note">${t("btNone")}</p>`}</div>`;
  $("#btDetail").innerHTML = `<h3 style="margin-top:0">${esc(m.member_id)} <span class="tag ${m.segment}">${t("seg_" + m.segment)}</span>${help(t("segHelp"))}
      <span class="tag">${t("cty")[m.country_code] ?? m.country_code}</span></h3>
    <div class="code" style="margin-bottom:4px">${t("btHist")} · ${t("btHistSub")(m.history.length)}</div>
    <div class="history-groups">${history.map(([department, items]) => {
      const recent = Math.min(...items.map((item) => item.days_before));
      return `<details class="history-group"><summary>${esc(department)} <span>· ${t("btHistorySummary")(items.length, recent)}</span></summary>
        <div class="chips">${items.map((item) => chip(item, t("btDaysAgo")(item.days_before))).join("")}</div></details>`;
    }).join("")}</div>
    <div class="code" style="margin-bottom:4px">${t("btBought")}</div>
    <div class="bt-bought">${m.bought.map(boughtItem).join("") || `<div class="empty">—</div>`}</div>
    <div class="cmp">${col("best", "🏆 " + t("btBest"))}${col("status_quo", t("btSq"))}</div>`;
}
async function loadBest() {
  try {
    BT = await (await fetch("reference/showcase.json")).json();
    BT.members.sort((a, b) => a.member_id.localeCompare(b.member_id));
    BSEL = BT.members[0]?.member_id ?? null; renderBest();
  } catch (e) { $("#btDetail").innerHTML = `<div class="empty">${t("error")}${esc(e.message)}</div>`; }
}
$("#bq").addEventListener("input", renderBest);
["#btCountry", "#btSegment", "#btOutcome", "#btSort"].forEach((selector) => $(selector).addEventListener("change", renderBest));
$("#btNamesBtn").addEventListener("click", () => $("#names").click());

async function boot() {
  $("#engine").textContent = t("boot1");
  const pyo = await loadPyodide();
  $("#engine").textContent = t("boot2"); await pyo.loadPackage("pandas");
  $("#engine").textContent = t("boot3"); pyo.FS.mkdir("reference");
  for (const f of FILES) { const r = await fetch(f); if (!r.ok) throw new Error(`cannot load ${f}`); pyo.FS.writeFile(f, new Uint8Array(await r.arrayBuffer())); }
  pyo.runPython(`
import sys, io, json
sys.path.insert(0, ".")
import pandas as pd
from recommend import load_refs, recommend, validate, profiles
REFS = load_refs("reference")
def run(text, k):
    df, rejected = validate(pd.read_csv(io.StringIO(text)))
    out = recommend(df, REFS, int(k))
    for c in ("n", "last", "cycle"):
        out[c] = out[c].astype("Int64")
    out["due"] = out["due"].fillna(False).astype(bool)
    return json.dumps({"members": int(df["member_id"].nunique()), "rows": len(df), "rejected": rejected,
                       "recs": json.loads(out.to_json(orient="records")), "profiles": json.loads(profiles(df, REFS).to_json(orient="records"))})
`);
  py = pyo;
  try { $("#aboutText").textContent = await (await fetch("ABOUT.md")).text(); } catch (e) {}
  $("#dot").classList.add("ok"); $("#engine").textContent = t("ready"); $("#sample").disabled = false;
  await runText(await sampleText());
}
const sampleText = async () => (await fetch("reference/sample_purchases.csv")).text();
async function runText(text) {
  try {
    const lines = (text.trim().match(/\n/g) || []).length;
    if (lines > 500) { toast(() => t("working")(lines), true); await new Promise((r) => setTimeout(r, 50)); }
    const res = JSON.parse(py.globals.get("run")(text, $("#k").value));
    DATA = { profiles: res.profiles, byMember: {} };
    for (const r of res.recs) (DATA.byMember[r.member_id] ||= []).push(r);
    const dues = (m) => (DATA.byMember[m] || []).filter((r) => r.due).length;
    DATA.profiles.sort((a, b) => dues(b.member_id) - dues(a.member_id) || a.member_id.localeCompare(b.member_id));
    if (!DATA.profiles.some((p) => p.member_id === SEL)) SEL = DATA.profiles[0]?.member_id ?? null;
    renderMembers(); renderDetail(); renderCampaign();
    toast(() => t("loaded")(res.members, res.rows, res.rejected));
  } catch (e) { toast(() => t("error") + String(e.message).split("\n").filter(Boolean).pop()); }
}

let LAST = null, LAST_NAME = null;
async function useFile(f) { LAST = await f.text(); LAST_NAME = f.name; $("#dropText").textContent = f.name; if (py) runText(LAST); }
$("#file").addEventListener("change", (e) => e.target.files[0] && useFile(e.target.files[0]));
const drop = $("#drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => e.dataTransfer.files[0] && useFile(e.dataTransfer.files[0]));
$("#sample").addEventListener("click", async () => { LAST = LAST_NAME = null; $("#dropText").textContent = t("drop"); runText(await sampleText()); });
$("#names").addEventListener("change", async (e) => { const f = e.target.files[0]; if (f) loadNames(await f.text()); e.target.value = ""; });
$("#k").addEventListener("input", (e) => ($("#kv").textContent = e.target.value));
$("#k").addEventListener("change", async () => py && runText(LAST ?? (await sampleText())));
$("#q").addEventListener("input", () => DATA && renderMembers());
$("#export").addEventListener("click", () => DATA && exportCsv());
function activateTab(b) {
  document.querySelectorAll(".tab").forEach((x) => {
    const active = x === b;
    x.classList.toggle("on", active); x.setAttribute("aria-selected", String(active)); x.tabIndex = active ? 0 : -1;
  });
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === b.dataset.v));
  $(".bar").style.display = b.dataset.v === "best" ? "none" : "";
}
document.querySelectorAll(".tab").forEach((b, i, tabs) => {
  b.addEventListener("click", () => activateTab(b));
  b.addEventListener("keydown", (event) => {
    let next = i;
    if (event.key === "ArrowRight") next = (i + 1) % tabs.length;
    else if (event.key === "ArrowLeft") next = (i + tabs.length - 1) % tabs.length;
    else if (event.key === "Home") next = 0;
    else if (event.key === "End") next = tabs.length - 1;
    else return;
    event.preventDefault(); tabs[next].focus(); tabs[next].click();
  });
});
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { L = b.dataset.l; i18n(); }));
i18n();
document.querySelectorAll(".kpi b").forEach((e, i) => setTimeout(() => count(e, +e.dataset.v, e.dataset.f, 1200), 300 + i * 120));
loadBest();
boot().catch((e) => { $("#engine").textContent = t("error") + e.message; });
</script>
</body>
