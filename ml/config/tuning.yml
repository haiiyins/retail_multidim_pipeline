# Search spaces of the fair tuning harness (ml/common/tuning.py, plan D5). 30 TPE trials per model, objective = unconditional
# NDCG@20 on valid. timeout_sec only cuts a study short and is reported; it never changes the trial budget of another model.
p1:
  space:
    num_leaves:        {type: int, low: 15, high: 255, log: true}
    learning_rate:     {type: float, low: 0.02, high: 0.2, log: true}
    min_child_samples: {type: int, low: 20, high: 500, log: true}
    feature_fraction:  {type: float, low: 0.5, high: 1.0}
    bagging_fraction:  {type: float, low: 0.5, high: 1.0}
    lambda_l2:         {type: float, low: 0.001, high: 10.0, log: true}
# Candidate sources (ease, tifuknn, sasrec, two_tower as R6 / R8 / R10 / R9) are explore-only and tuned on the explore coverage they
# add to R1–R5@200 on valid (ml/retrieval/base.py); their baseline rows of t31 score repeats too and get their own budget on NDCG@20.
ease:
  space:
    l2: {type: float, low: 10.0, high: 100000.0, log: true}
tifuknn:
  space:
    k:     {type: int, low: 50, high: 1000, log: true}
    r_b:   {type: float, low: 0.5, high: 1.0}
    r_g:   {type: float, low: 0.5, high: 1.0}
    alpha: {type: float, low: 0.0, high: 1.0}
sasrec:
  space:
    d:       {type: categorical, choices: [64, 128, 256]}
    blocks:  {type: int, low: 1, high: 3}
    dropout: {type: float, low: 0.0, high: 0.5}
    lr:      {type: float, low: 0.0001, high: 0.003, log: true}
two_tower:
  space:
    d:           {type: categorical, choices: [64, 128, 256]}
    temperature: {type: float, low: 0.02, high: 0.2, log: true}
    lr:          {type: float, low: 0.0001, high: 0.003, log: true}
    dropout:     {type: float, low: 0.0, high: 0.5}
p3:
  space:
    d:          {type: categorical, choices: [64, 128]}
    dropout:    {type: float, low: 0.0, high: 0.4}
    lr:         {type: float, low: 0.0001, high: 0.003, log: true}
    lambda_d90: {type: float, low: 0.0, high: 1.0}
    lambda_haz: {type: float, low: 0.0, high: 1.0}
explin:
  space:
    l2:             {type: float, low: 1.0, high: 100000.0, log: true}
    half_life_days: {type: float, low: 7.0, high: 730.0, log: true}
rp3beta:
  space:
    alpha: {type: float, low: 0.2, high: 1.5}
    beta:  {type: float, low: 0.0, high: 1.0}
trend:
  space:
    window_days: {type: int, low: 3, high: 28}
    w_dept:      {type: float, low: 0.0, high: 3.0}
    w_price:     {type: float, low: 0.0, high: 3.0}
