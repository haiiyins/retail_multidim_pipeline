# Learned candidate sources R6–R10 (ml/retrieval/, plan §5.1). Each source is fitted per country at every rolling cutoff
# (ml/common/pit.py) and scores the universe below; `params` are the defaults, replaced by the tuned ones when
# data/ml/tuning/<source>.parquet exists. Tuning objective of a source: the unconditional explore coverage it adds to R1–R5@200
# on valid, Δ = 30 (cand_explore of the union minus R1–R5 alone).
full_catalogue: [sasrec]   # build also writes the unmasked top-100 of valid / test anchors: the SASRec NBR baseline of t31
explore_only: true    # mask the models the member bought before the anchor out of every learned source (R1 covers repeats)
universe:
  size: 5000          # top models by buyers in the window before the cutoff (t28b: 97 % of positives rank inside the top 5 000)
  window_days: 365
n_out: 100            # candidates kept per anchor and source, after the anchor_model_grid filter
delta: 30
chunk: 8192           # anchors scored per GPU batch
ease:
  fit_window_days: 730
  params: {l2: 500.0}
tifuknn:
  group_size: 7       # baskets per group (Hu et al., SIGIR 2020)
  pool_size: 300000   # neighbour pool: members active in the pool window before the cutoff, sampled with seed 0
  pool_active_days: 365
  params: {k: 300, r_b: 0.9, r_g: 0.7, alpha: 0.7}
sasrec:
  max_len: 50         # baskets (purchase days)
  width: 16           # models kept per basket, universe models first
  heads: 2
  batch: 256          # members; every step whose Δ window closes before the cutoff is an example (dense all-action loss)
  epochs: 8
  params: {d: 128, blocks: 2, dropout: 0.2, lr: 0.001}
two_tower:
  max_len: 50
  heads: 2
  blocks: 2
  batch: 2048
  epochs: 8
  refs_per_epoch: 4   # reference days per member and epoch, resampled
  price_buckets: 10
  params: {d: 128, temperature: 0.05, lr: 0.001, dropout: 0.1}
item2vec:
  params: {d: 64, window: 10, negative: 10, epochs: 5, min_count: 5, half_life_days: 90}
  workers: 20         # per process; `make ml-retrieval` builds the three countries in parallel
explin:
  refs_per_member: 3      # training reference days per member (base.reference_days), sampled with seed 0
  max_examples: 2000000
  params: {l2: 1000.0, half_life_days: 180.0}
rp3beta:
  fit_window_days: 730
  params: {alpha: 0.8, beta: 0.4}
trend:
  params: {window_days: 14, w_dept: 1.0, w_price: 0.5}
rex:                      # single-stage Repeat–Explore network (ml/retrieval/rex.py), a t31 row via ml/baselines/nbr.py
  max_len: 50             # baskets (purchase days)
  width: 16
  heads: 2
  batch: 1024             # reference days
  epochs: 8
  refs_per_epoch: 4
  price_buckets: 10
  web_window_days: 30
  params: {d: 128, blocks: 2, dropout: 0.1, lr: 0.001}
rex2:                     # REX v2: + price / promotion inputs and the member's own repeat features; other settings of rex
  epochs: 8
  params: {d: 128, blocks: 2, dropout: 0.1, lr: 0.001}
mixer:                    # ml/retrieval/mixer.py (ML-13)
  learned: [ease, item2vec, tifuknn, two_tower, sasrec, explin, rp3beta, trend]
  k: 300                  # cap of ml.candidates_v2 for the rankers, read off the t30 curve
  k_max: 500
  curve_k: [100, 200, 300, 500]
  rho_prior: 20           # pseudo-rows of the country mean in the member's repeat share
  rho_clip: [0.2, 5.0]
