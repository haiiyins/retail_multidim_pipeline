name: retail_multidim
version: "1.0"
config-version: 2
profile: retail_multidim
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]
vars:
  countries: ["SG", "TH", "VN"]      # scope decided 2026-10-28 (issue #54): the countries covered by the Parquet re-export; PH and TW exist only in the capped CSV export
  country_filter: "{{ env_var('COUNTRY_FILTER', 'ALL') }}"
  n_candidates: "{{ env_var('N_CANDIDATES', '200') }}"
  allow_store_prices: false                       # enable if audit.price_uniformity shows large store-vs-website gaps
  data_root: "{{ env_var('DATA_ROOT', './data') }}"
models:
  retail_multidim:
    staging:
      +materialized: view
      +schema: staging
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
    quarantine:
      +materialized: table
      +schema: quarantine
    audit:
      +materialized: table
      +schema: audit
on-run-end:
  - "{{ log_run_results(results) }}"      # wall time and rows per model → audit.pipeline_run_metrics
