version: 2
models:
  - name: slv_member_bridge
    columns: [{name: transaction_id, tests: [not_null, unique]}, {name: member_id, tests: [not_null]}]
  - name: slv_member_profile
    columns: [{name: member_id, tests: [not_null, unique]}]
  - name: slv_dim_model
    columns: [{name: item_code, tests: [not_null, unique]}, {name: model_code, tests: [not_null]}]
  - name: slv_fact_sales_line
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [transaction_id, item_code]       # QC-4
    columns:
      - {name: transaction_id, tests: [not_null]}                   # QC-1
      - {name: transaction_ts_local, tests: [{dbt_utils.accepted_range: {max_value: "current_timestamp", inclusive: true}}]}   # QC-3, no future timestamps
      - {name: model_code, tests: [not_null]}
      - {name: country_code, tests: [not_null]}
      - name: qty
        tests: [{dbt_utils.accepted_range: {min_value: 0, inclusive: false}}]   # QC-3
      - name: gmv_local
        tests: [{dbt_utils.accepted_range: {min_value: 0, inclusive: false}}]
      - name: discount_local
        tests: [{dbt_utils.accepted_range: {min_value: 0, inclusive: true, config: {severity: warn}}}]   # VN: 1,291 negative discounts (surcharges) — reviewed, warn only
      - name: store_tz
        tests: [{not_null: {config: {severity: warn}}}]   # store missing from dim_business_unit; transaction_ts_utc then uses the country's zone
  - name: slv_price_sku_interval
    description: Non-overlapping SKU price intervals per country, national (website) prices, promo_kind and promo_depth (issue #16).
    columns:
      - {name: item_code, tests: [not_null]}
      - {name: country_code, tests: [not_null]}
      - {name: eff_start, tests: [not_null]}
      - {name: eff_end, tests: [not_null]}
      - {name: price, tests: [{dbt_utils.accepted_range: {min_value: 0, inclusive: false}}]}
      - {name: promo_kind, tests: [{accepted_values: {values: ['NONE', 'DAILY', 'SEASONAL', 'CLEARANCE', 'DROP']}}]}
      - {name: promo_depth, tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 0.9, inclusive: true}}]}   # QC-3
  - name: slv_fact_returns
    description: Return lines of finished return transactions with the original sale when the export links it (issue #15).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [transaction_id, transaction_num_line]       # QC-4
    columns:
      - {name: transaction_id, tests: [not_null]}
      - {name: transaction_num_line, tests: [not_null]}
      - {name: item_code, tests: [not_null]}
      - {name: return_date, tests: [not_null]}
      - {name: qty, tests: [{dbt_utils.accepted_range: {min_value: 0, inclusive: false}}]}   # QC-3, returned quantity is positive
  - name: slv_user_to_member
    columns: [{name: user_id, tests: [not_null, unique]}, {name: member_id, tests: [not_null]}]
  - name: slv_stock_daily_model
    columns: [{name: model_code, tests: [not_null]}]
  - name: slv_web_events_clean
    description: Web/app events flattened from the metadata struct, one row per event with the numeric product codes as a list (model_codes, unnested only in gld_web_stitched); only is_event_to_use events (issue #6).
    tests:
      - dbt_utils.expression_is_true: {expression: "len(list_filter(model_codes, lambda m: NOT regexp_matches(m, '^[0-9]+$'))) = 0"}
    columns:
      - {name: event_id, tests: [not_null, {unique: {config: {severity: warn}}}]}
      - {name: event_name, tests: [not_null]}
      - {name: country_code, tests: [not_null, {accepted_values: {values: ['SG', 'TH', 'VN']}}]}
      - {name: platform, tests: [{accepted_values: {values: ['web', 'app']}}]}
  - name: slv_calendar_enriched
    description: One row per country × day 2023–2026 with public holidays and commercial events inferred from the promotion share (issues #17, #18).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [country_code, calendar_date]
    columns:
      - {name: country_code, tests: [not_null]}
      - {name: calendar_date, tests: [not_null]}
      - {name: promo_share, tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1, inclusive: true}}]}
  - name: slv_member_sport_asof
    description: Favourite-sport validity intervals per member × sport; open intervals have valid_to NULL; from_before_export marks sports active before the export window (issue #22).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [member_id, sport_id, valid_from]
    columns:
      - {name: member_id, tests: [not_null]}
      - {name: sport_id, tests: [not_null]}
      - {name: valid_from, tests: [not_null]}
      - name: valid_to
        tests: [{dbt_utils.expression_is_true: {expression: "> valid_from", config: {where: "valid_to IS NOT NULL"}}}]
  - name: slv_member_store_daily
    description: Running usual store per member × offline purchase day (mode of cumulative transactions, ties → most recent), read point-in-time by Gold (issue #23).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [member_id, as_of_date]
    columns:
      - {name: member_id, tests: [not_null]}
      - {name: as_of_date, tests: [not_null]}
      - {name: usual_store_id, tests: [not_null]}
      - {name: usual_store_share, tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1, inclusive: true}}]}
