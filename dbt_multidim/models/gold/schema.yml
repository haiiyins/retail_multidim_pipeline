version: 2
models:
  - name: gld_web_stitched
    description: Web / app events attributed to a member (DIRECT login or STITCHED cookie mapping within ± 90 days), with identity_verified_ts for the point-in-time rule.
    columns:
      - {name: event_id, tests: [not_null]}
      - {name: member_id, tests: [not_null]}
      - {name: identity_verified_ts, tests: [not_null]}
      - {name: id_source, tests: [{accepted_values: {values: ['DIRECT', 'STITCHED']}}]}
      - {name: country_code, tests: [{accepted_values: {values: ['SG', 'TH', 'VN']}}]}
  - name: gld_copurchase_lift
    description: >
      Co-purchase support, confidence and lift per (country, model_a, model_b) over baskets before vars.copurchase_cutoff
      (2025-10-27 = valid_lo of evaluation/split.yml, so validation and test labels never contribute); pairs with at least
      vars.copurchase_min_support common baskets; rank_in_a orders b within a by lift, pairs with at least
      vars.copurchase_strong_support common baskets first (R2 takes rank_in_a <= 20); rank_by_support orders by common baskets.
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [country_code, model_a, model_b]}
    columns:
      - {name: lift, tests: [not_null, {dbt_utils.expression_is_true: {expression: "> 0"}}]}
      - {name: confidence, tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1, inclusive: true}}]}
      - {name: n_ab, tests: [{dbt_utils.expression_is_true: {expression: ">= 5"}}]}
  - name: gld_fs_member
    description: >
      Entity 1 — member features at (member_id, anchor_date) for the used anchors of gold.anchor_grid; every aggregate reads data
      strictly before the anchor (QC-6, tests/leakage_fs_member.sql). meta.group tags the feature groups used by
      evaluation/ablation_configs.yml: F0 purchase history, F1 price position, F3 promotion affinity, F5 web activity, Sport, Store.
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [member_id, anchor_date]}
      - dbt_utils.expression_is_true: {expression: "tx_365d >= tx_90d AND tx_90d >= tx_30d"}
    columns:
      - {name: member_id, tests: [not_null]}
      - {name: anchor_date, tests: [not_null]}
      - {name: split, description: train / valid / test window of the anchor (bookkeeping, not a feature), tests: [{accepted_values: {values: ['train', 'valid', 'test']}}]}
      - {name: in_train_sample, description: stride sample flag (bookkeeping)}
      - {name: tx_30d, meta: {group: F0}, description: transactions in the 30 days before the anchor}
      - {name: tx_90d, meta: {group: F0}}
      - {name: tx_365d, meta: {group: F0}, tests: [not_null]}
      - {name: items_365d, meta: {group: F0}, description: units bought in 365 days}
      - {name: models_365d, meta: {group: F0}, description: distinct models bought in 365 days}
      - {name: days_since_last_tx, meta: {group: F0}, description: NULL when no purchase in the 365-day window}
      - {name: gmv_eur_365d, meta: {group: F0}}
      - {name: return_rate, meta: {group: F0}, description: returned transactions / transactions over 365 days, capped at 1, tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1, inclusive: true}}]}
      - {name: account_tenure_days, meta: {group: F0}}
      - {name: price_q25, meta: {group: F1}, description: quartiles of the regular selling price of the items bought in 365 days (local currency)}
      - {name: price_q50, meta: {group: F1}}
      - {name: price_q75, meta: {group: F1}}
      - {name: price_q50_eur, meta: {group: F1}}
      - {name: promo_affinity, meta: {group: F3}, description: share of lines bought with a discount in 365 days, tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1, inclusive: true}}]}
      - {name: n_sports, meta: {group: Sport}, description: favourite sports valid at the anchor (slv_member_sport_asof)}
      - {name: sport_ids, meta: {group: Sport}, description: list of sport ids, used by candidate source R4 (not a ranker feature)}
      - {name: usual_store_id, meta: {group: Store}, description: running usual store as of the last offline purchase day before the anchor (used by R5 and the stock features)}
      - {name: usual_store_share, meta: {group: Store}}
      - {name: stores_visited_cum, meta: {group: Store}}
      - {name: web_sessions_7d, meta: {group: F5}}
      - {name: web_sessions_30d, meta: {group: F5}, description: attributed sessions in the 30 days before the anchor, attribution known at the anchor}
      - {name: web_events_30d, meta: {group: F5}}
      - {name: web_models_30d, meta: {group: F5}, description: distinct models viewed / carted}
      - {name: has_web_signal, meta: {group: F5}, tests: [not_null]}
      - {name: web_days_available_30d, meta: {group: F5}, description: days with usable web events in the country during the window}
      - {name: web_data_available, meta: {group: F5}, description: false when the country had no usable web data in the window (VN before 2024-08), so that absence of activity is not read as inactivity, tests: [not_null]}
      - {name: last_source_ts, description: latest source timestamp that fed the row (QC-6 bookkeeping)}
  - name: gld_fs_model_country
    description: >
      Entity 2 — model × country features at the anchor, one row per row of gold.anchor_model_grid (tests/fs_model_country_no_row_loss.sql).
      Price = median over the model's SKU intervals valid on the anchor date (temporary promotion preferred over STANDARD per SKU);
      popularity and seasonality from sales strictly before the anchor; stock columns are NULL unless vars.use_stock (issue #21).
      QC-6: tests/leakage_fs_model_country.sql. meta.group tags F1 price, F2 popularity, F3 promotion / calendar / seasonality, Stock.
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [model_code, country_code, anchor_date]}
    columns:
      - {name: model_code, tests: [not_null]}
      - {name: country_code, tests: [not_null]}
      - {name: anchor_date, tests: [not_null]}
      - {name: price_local, meta: {group: F1}, description: "median selling price of the SKUs priced at the anchor (local currency); NULL when no SKU has a valid interval", tests: [{dbt_utils.expression_is_true: {expression: "> 0"}}]}
      - {name: ref_price_local, meta: {group: F1}, description: "median reference (full) price of the same SKUs"}
      - {name: n_sku_priced, meta: {group: F1}}
      - {name: sku_price_coverage, meta: {group: F1}, description: "priced SKUs / SKUs of the model", tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1, inclusive: true}}]}
      - {name: promo_kind, meta: {group: F3}, description: "most common promo kind among the priced SKUs"}
      - {name: is_temp_promo, meta: {group: F3}, description: "at least half of the priced SKUs are on a temporary promotion"}
      - {name: temp_promo_share, meta: {group: F3}}
      - {name: promo_depth, meta: {group: F3}, description: "1 − price / reference price, clipped to [0, 0.9] (QC-3)", tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 0.9, inclusive: true}}]}
      - {name: in_commercial_event, meta: {group: F3}}
      - {name: days_to_next_holiday, meta: {group: F3}}
      - {name: country_promo_share, meta: {group: F3}, description: "share of the country's SKUs on a temporary promotion that day (slv_calendar_enriched.promo_share)"}
      - {name: buyers_28d, meta: {group: F2}, description: "distinct buyers in the 28 days before the anchor"}
      - {name: qty_28d, meta: {group: F2}}
      - {name: popularity_rank, meta: {group: F2}, description: "rank by buyers_28d within country × anchor (1 = most bought)", tests: [{dbt_utils.expression_is_true: {expression: ">= 1"}}]}
      - {name: model_age_days, meta: {group: F2}, description: "days since the model's first sale in the country; NULL when it has not been sold before the anchor"}
      - {name: seasonal_idx, meta: {group: F3}, description: "units sold in the same two weeks one year earlier over the weekly average of that year"}
      - {name: avail_store_ratio, meta: {group: Stock}, description: "NULL unless vars.use_stock"}
      - {name: stock_qty_national, meta: {group: Stock}, description: "NULL unless vars.use_stock"}
      - {name: last_source_ts, description: "latest transaction timestamp or price interval start that fed the row (QC-6)"}
  - name: gld_sport_department_affinity
    description: "Learnt bridge from favourite-sport ids to catalogue sport departments (lift of P(department | sport) over P(department)) on purchases before vars.copurchase_cutoff; top 5 departments per sport and country with >= 20 lines and lift > 1.5. Input of candidate source R4."
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [country_code, sport_id, sport_department_code]}
    columns:
      - {name: lift, tests: [not_null, {dbt_utils.expression_is_true: {expression: "> 1.5"}}]}
      - {name: rank_in_sport, tests: [{dbt_utils.accepted_range: {min_value: 1, max_value: 5, inclusive: true}}]}
  - name: gld_candidates
    description: "Up to vars.n_candidates candidate models per used anchor from sources r1 repurchase, r2 co-purchase, r3 web intent, r4 sport x offer, r5 national best-sellers (stock filter only with vars.use_stock); priority R1 > R3 > R2 > R4 > R5, then the source score. QC-4 unique (member, model, anchor); recall per source in audit.candidate_recall."
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [member_id, anchor_date, model_code]}   # QC-4
      - dbt_utils.expression_is_true: {expression: "r1 + r2 + r3 + r4 + r5 >= 1"}
    columns:
      - {name: member_id, tests: [not_null]}
      - {name: anchor_date, tests: [not_null]}
      - {name: model_code, tests: [not_null]}
      - {name: candidate_rank, tests: [{dbt_utils.accepted_range: {min_value: 1, max_value: 200, inclusive: true}}]}
      - {name: priority_source, tests: [{accepted_values: {values: [1, 2, 3, 4, 5], quote: false}}]}
  - name: gld_fs_pair
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [member_id, model_code, anchor_date]}   # QC-4
  - name: gld_ranking_dataset
    columns: [{name: label_30, tests: [{accepted_values: {values: [0, 1]}}]}]
